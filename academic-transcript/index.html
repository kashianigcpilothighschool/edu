<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <title>রেজাল্ট ট্রান্সক্রিপ্ট</title>
    <link href="https://fonts.googleapis.com/css2?family=Nikosh:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Nikosh', sans-serif;
            background: linear-gradient(135deg, #0e7a38 0%, #14A44D 100%);
            padding: 20px;
            margin: 0;
            color: #333;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        #result {
            flex: 1;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.4;
            }

            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.8;
            }
        }

        .watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: repeating-linear-gradient(45deg,
                    rgba(255, 255, 255, 0.02) 0,
                    rgba(255, 255, 255, 0.02) 1px,
                    transparent 1px,
                    transparent 25px);
        }

        .watermark::after {
            content: "109487 109487 109487 109487 109487 109487";
            font-size: 9px;
            line-height: 12px;
            white-space: pre-wrap;
            color: rgba(255, 255, 255, 0.03);
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transform: rotate(-25deg);
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .back-home {
            position: absolute;
            top: 0;
            left: 15px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.12);
            padding: 8px 14px;
            border-radius: 20px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        .logo-area {
            margin-bottom: 20px;
        }

        .school-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0e7a38, #14A44D);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .school-logo i {
            font-size: 35px;
            color: white;
        }

        .main-title {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 auto 8px;
            max-width: 800px;
            animation: slideInDown 1s ease-out;
        }

        .school-name {
            font-size: 24px;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin: 0 auto;
            max-width: 800px;
            line-height: 1.4;
            animation: slideInDown 1s ease-out;
        }

        .sub-title {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            animation: slideInUp 1s ease-out;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-area {
            display: flex;
            justify-content: center;
            padding: 0 15px;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .search-container {
            background: #ffffff;
            border-radius: 10px;
            padding: 0 0 28px;
            display: inline-block;
            text-align: left;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: 1px solid #e0e6ed;
            border-top: 4px solid #d4af37;
            animation: fadeInScale 1.2s ease-out;
            width: 100%;
            max-width: 640px;
            overflow: hidden;
        }

        .search-title {
            margin: 0;
            padding: 16px 30px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            background: #f4f6f4;
            border-bottom: 1px solid #e6ebe8;
            text-align: left;
        }

        .field-grid {
            display: flex;
            flex-direction: column;
            padding: 8px 30px 0;
        }

        .field {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #eef1ee;
            border-radius: 0;
            padding: 14px 0;
        }

        .field:last-child {
            border-bottom: none;
        }

        .field:focus-within label {
            color: #14A44D;
        }

        .field label {
            white-space: nowrap;
            font-size: 14px;
            font-weight: 700;
            color: #333;
            width: 210px;
            flex-shrink: 0;
        }

        .field select,
        .field input {
            min-width: 0;
            flex: 1;
            border: 1.5px solid #dde3e8 !important;
            background: #fff !important;
            padding: 10px 14px !important;
            border-radius: 8px;
            box-shadow: none !important;
        }

        .field select:focus,
        .field input:focus {
            border-color: #14A44D !important;
            box-shadow: 0 0 0 3px rgba(20, 164, 77, 0.12) !important;
        }

        .field-wide {
            grid-column: unset;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 22px;
            padding: 0 30px;
        }

        .button-row .btn {
            flex: 1;
            margin-left: 0;
            justify-content: center;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        input#rollInput {
            padding: 13px 20px;
            font-size: 15px;
            border-radius: 12px;
            border: 1.5px solid #dde3e8;
            width: 100%;
            background: #fff;
            color: #333;
            font-family: 'Nikosh', sans-serif;
            transition: all 0.2s ease;
        }

        input#rollInput:focus {
            outline: none;
            border-color: #14A44D;
            box-shadow: 0 0 0 3px rgba(20, 164, 77, 0.12);
        }

        input#rollInput::placeholder {
            color: #a3a3a3;
        }

        select#classSelect,
        select#sectionSelect,
        select#examSelect,
        select#yearSelect {
            padding: 13px 16px;
            font-size: 15px;
            border-radius: 12px;
            border: 1.5px solid #dde3e8;
            background: #fff;
            color: #333;
            font-family: 'Nikosh', sans-serif;
            transition: all 0.2s ease;
            cursor: pointer;
            width: 100%;
        }

        select#classSelect:focus,
        select#sectionSelect:focus,
        select#examSelect:focus,
        select#yearSelect:focus {
            outline: none;
            border-color: #14A44D;
            box-shadow: 0 0 0 3px rgba(20, 164, 77, 0.12);
        }

        .btn {
            padding: 14px 22px;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, #0e7a38, #14A44D);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Nikosh', sans-serif;
            font-weight: 600;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 15px rgba(20, 164, 77, 0.25);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(20, 164, 77, 0.35);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus-visible {
            outline: 2px solid #0e7a38;
            outline-offset: 2px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.25);
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.35);
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: #fffdf6;
            padding: 8px;
            border-radius: 4px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 1;
            border: 3px solid #0e7a38;
            animation: slideInFade 1.5s ease-out;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1.5px solid #b5121b;
            pointer-events: none;
            z-index: 0;
        }

        .container > * {
            position: relative;
            z-index: 1;
            padding-left: 34px;
            padding-right: 34px;
        }

        .container > .transcript-header {
            padding-top: 30px;
        }

        .container > .print-timestamp {
            padding-bottom: 20px;
        }

        @keyframes slideInFade {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .transcript-header {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #0e7a38;
            position: relative;
        }
        
        /* --- NEW CSS FOR LOGO --- */
        .print-logo {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            border-radius: 0;
            border: 2px solid #0e7a38;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            order: 1;
        }

        .school-details {
            text-align: center;
            display: contents;
        }
        /* --- END OF NEW CSS --- */

        .transcript-header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 2px;
            background: #b5121b;
            border-radius: 2px;
        }

        .transcript-header h2 {
            font-size: 21px;
            font-weight: 700;
            color: #000000;
            margin: 6px 0 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
            order: 0;
        }

        .transcript-header h3 {
            font-size: 14px;
            font-weight: 500;
            color: #34495e;
            margin: 2px 0;
            order: 3;
        }

        .school-details h3:last-of-type {
            font-size: 15px;
            font-weight: 700;
            color: #0e7a38;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-decoration: underline;
            margin-top: 6px;
            order: 2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 22px;
            font-size: 13.5px;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            border: 1.5px solid #000;
        }

        th {
            background: #f4f6f4;
            color: #000;
            padding: 10px 8px;
            font-weight: 700;
            text-transform: none;
            letter-spacing: 0.3px;
            font-size: 13px;
        }

        th,
        td {
            border: 1px solid #444;
            padding: 9px 8px;
            text-align: center;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #F0FAF4;
        }

        tr:nth-child(even) {
            background: #fbfbf8;
        }

        .student-info-section {
            display: flex;
            gap: 18px;
            margin-bottom: 20px;
            margin-top: 18px;
            align-items: stretch;
        }

        .info-content {
            flex: 1;
        }

        .info-table td strong i {
            margin-right: 8px;
            color: #0e7a38;
        }

        .info-table {
            background: transparent;
            border: none;
            border-radius: 0;
            overflow: visible;
            margin-bottom: 0;
            width: 100%;
            box-shadow: none;
        }

        .info-table td {
            text-align: left;
            border: none;
            padding: 5px 0;
            font-weight: 500;
            font-size: 13.5px;
            color: #000000;
        }

        .info-table tr:last-child td {
            border-bottom: none;
        }

        .grade-scale {
            font-size: 11px;
            width: 190px;
            flex-shrink: 0;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            border: 1.5px solid #000;
            background: white;
        }

        .grade-scale table {
            margin: 0;
            box-shadow: none;
            border: none;
        }

        .grade-scale th,
        .grade-scale td {
            padding: 5px 6px;
            border: 1px solid #999;
            font-size: 10.5px;
        }

        .grade-scale th {
            background: #f4f6f4;
            color: #000;
            font-weight: 700;
        }

        .summary-section {
            margin-top: 22px;
            padding: 14px 20px;
            background: #fff;
            border-radius: 0;
            border: 1.5px solid #000;
        }

        .summary-line {
            font-size: 14px;
            text-align: center;
            font-weight: 600;
            color: #000000;
            line-height: 1.8;
        }
        
        .summary-item strong i {
             margin-right: 8px;
        }

        .summary-item {
            display: inline-block;
            margin: 4px 16px;
            padding: 0;
            background: transparent;
            border-radius: 0;
            box-shadow: none;
        }

        .signature {
            display: flex;
            justify-content: space-between;
            margin-top: 55px;
            padding: 0 60px 26px;
            font-size: 14px;
            font-weight: 600;
            color: #000000;
            font-style: italic;
        }

        .signature div {
            text-align: center;
            position: relative;
            padding-top: 45px;
        }

        .signature div::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 1px;
            background: #000000;
        }

        .print-timestamp {
            display: none;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            color: #14A44D;
            font-weight: 500;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                color: rgba(0, 0, 0, 0);
                text-shadow: .25em 0 0 rgba(0, 0, 0, 0), .5em 0 0 rgba(0, 0, 0, 0);
            }

            40% {
                color: #14A44D;
                text-shadow: .25em 0 0 rgba(0, 0, 0, 0), .5em 0 0 rgba(0, 0, 0, 0);
            }

            60% {
                text-shadow: .25em 0 0 #14A44D, .5em 0 0 rgba(0, 0, 0, 0);
            }

            80%,
            100% {
                text-shadow: .25em 0 0 #14A44D, .5em 0 0 #14A44D;
            }
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
            padding: 30px;
            background: rgba(231, 76, 60, 0.1);
            border-radius: 15px;
            border: 2px solid rgba(231, 76, 60, 0.2);
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 30px 20px;
            }

            .main-title {
                font-size: 12px;
                letter-spacing: 1px;
            }

            .school-name {
                font-size: 18px;
            }
            
            .student-info-section {
                display: block;
            }

            .search-container {
                padding: 0 0 20px;
                border-radius: 16px;
            }

            .search-title {
                padding: 14px 20px;
                font-size: 13.5px;
            }

            .field-grid {
                padding: 18px 18px 0;
            }

            .button-row {
                padding: 0 18px;
            }

            .field-grid {
                grid-template-columns: 1fr;
            }

            .field {
                flex-direction: column;
                align-items: stretch;
            }

            .field label {
                min-width: 0;
            }

            .field-wide {
                grid-column: auto;
            }

            .button-row {
                flex-direction: column;
            }

            input#rollInput {
                width: 100%;
            }

            .btn {
                width: 100%;
                margin-left: 0;
            }

            /* --- Responsive style for logo --- */
            .transcript-header {
                flex-direction: column;
                gap: 15px;
            }

            .print-logo {
                 width: 70px;
                 height: 70px;
            }
            /* --- End responsive style for logo --- */

            .grade-scale {
                width: 100%;
                margin-top: 20px;
                animation: none;
            }

            .signature {
                padding: 0 20px;
            }

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 8px 6px;
            }
        }
        
        /* --- PRINT STYLES --- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0.05in;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            strong {
                font-weight: bold !important;
            }

            html, body {
                height: 100%;
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                font-size: 9pt !important;
                line-height: 1.2 !important;
                color: #000 !important;
            }
            
            /* Hide unnecessary elements */
            .header-section, .search-area, .btn, .bg-particles, .watermark, .transcript-header::after, i, .fas, .fa, .site-footer {
                display: none !important;
            }
            
            /* Make sure the logo is visible on print */
            .print-logo {
                display: block !important;
                width: 58px !important;
                height: 58px !important;
                border-radius: 0 !important;
                border: 1px solid #000 !important;
                order: 1 !important;
            }
            
            .container {
                width: 100% !important;
                max-width: none !important;
                box-shadow: inset 0 0 0 6px #fff, inset 0 0 0 7.5px #b5121b !important;
                border: 2.5px solid #0e7a38 !important;
                border-radius: 0 !important;
                padding: 12px 8px 2px !important;
                margin: 0 !important;
                background: white !important;
                display: flex;
                flex-direction: column;
                min-height: 100%;
                position: relative !important;
                z-index: 1 !important;
            }

            .container > * {
                padding-left: 10px !important;
                padding-right: 10px !important;
            }

            .container::before {
                display: none !important;
            }

            /* Faint repeated watermark, printed behind all content on every page */
            .container::after {
                content: "109487   109487   109487   109487\A109487   109487   109487   109487\A109487   109487   109487   109487\A109487   109487   109487   109487\A109487   109487   109487   109487\A109487   109487   109487   109487\A109487   109487   109487   109487\A109487   109487   109487   109487\A109487   109487   109487   109487\A109487   109487   109487   109487\A109487   109487   109487   109487\A109487   109487   109487   109487" !important;
                position: fixed !important;
                top: 50% !important;
                left: 50% !important;
                width: 130vw !important;
                height: 130vh !important;
                display: block !important;
                white-space: pre !important;
                text-align: center !important;
                font-size: 13pt !important;
                line-height: 2.4 !important;
                color: rgba(0, 0, 0, 0.07) !important;
                font-weight: bold !important;
                transform: translate(-50%, -50%) rotate(-30deg) !important;
                z-index: -1 !important;
                pointer-events: none !important;
            }
            
            .transcript-header {
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
                align-items: center !important;
                gap: 6px !important;
                text-align: center !important;
                margin-bottom: 8px !important;
                padding-bottom: 6px !important;
                border-bottom: 2px solid #000 !important;
                page-break-inside: avoid !important;
                page-break-after: avoid !important;
            }
            
            .school-details {
                text-align: center !important;
                display: contents !important;
            }

            .transcript-header h2 {
                font-size: 15pt !important;
                font-weight: bold !important;
                margin: 0 0 2px 0 !important;
                color: #000 !important;
                order: 0 !important;
            }

            .transcript-header h3 {
                font-size: 10.5pt !important;
                font-weight: normal !important;
                margin: 1px 0 !important;
                color: #000 !important;
                order: 3 !important;
            }

            .school-details h3:last-of-type {
                order: 2 !important;
            }

            .student-info-section {
                display: flex !important;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 8px !important;
                page-break-inside: avoid !important;
            }

            .info-content {
                flex-grow: 1;
            }
            
            .info-table {
                background: transparent !important;
                border: none !important;
                border-radius: 0 !important;
                margin-bottom: 0 !important;
                width: 100% !important;
                box-shadow: none !important;
            }

            .main-content-wrapper .info-table td {
                padding: 3.5px 10px !important;
                font-size: 9.5pt !important;
                border: none !important;
                color: #000 !important;
                text-align: left !important;
            }

            .grade-scale {
                flex-shrink: 0;
                width: 170px !important;
                font-size: 8pt !important;

    <script>
        // Create animated background particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 25;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize particles
        createParticles();

        // Enhanced search functionality
        function isSeniorClass(className) {
            return className === 'Nine' || className === 'Ten';
        }

        function searchResult() {
            const roll = document.getElementById("rollInput").value.trim();
            const className = document.getElementById("classSelect").value;
            const senior = isSeniorClass(className);
            const section = senior
                ? document.getElementById("groupSelect").value
                : document.getElementById("sectionSelect").value;
            const examName = document.getElementById("examSelect").value;
            const examYear = document.getElementById("yearSelect").value;
            const resultDiv = document.getElementById("result");

            if (!className) {
                resultDiv.innerHTML = `<div class="container" style="animation: none;"><div class="error-message">⚠ Please select Class!</div></div>`;
                return;
            }

            if (!section) {
                const msg = senior ? 'Please select Group!' : 'Please select Section!';
                resultDiv.innerHTML = `<div class="container" style="animation: none;"><div class="error-message">⚠ ${msg}</div></div>`;
                return;
            }

            if (!examName || !examYear) {
                resultDiv.innerHTML = `<div class="container" style="animation: none;"><div class="error-message">⚠ Please select Name of Examination and Year!</div></div>`;
                return;
            }

            if (!roll) {
                resultDiv.innerHTML = `<div class="container" style="animation: none;"><div class="error-message">⚠ Please enter your Roll Number!</div></div>`;
                return;
            }

            document.getElementById("result").innerHTML = '<div class="loading">Loading result</div>';

            // ✅ Apps Script ওয়েব অ্যাপের Deploy URL (kashiani1.pages.dev থেকে হোস্ট করার জন্য fetch ব্যবহার করা হচ্ছে)
            const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaULoHbIe2sFA6OIhSa-j0GUSn4C6CsBLw5s_JJ1Q-s1i1A430AKp84IqZF0rhR1iX/exec";

            const params = new URLSearchParams({ roll, class: className, section, examName, examYear });

            fetch(APPS_SCRIPT_URL + "?" + params.toString())
                .then(res => res.json())
                .then(data => displayResult(data))
                .catch(err => {
                    document.getElementById("result").innerHTML = `<div class="container" style="animation: none;"><div class="error-message">⚠ Server error: ${err.message}</div></div>`;
                });
        }

        // Toggle Section / Group fields based on selected class
        document.getElementById('classSelect').addEventListener('change', function () {
            const sectionField = document.getElementById('sectionField');
            const groupField = document.getElementById('groupField');

            if (isSeniorClass(this.value)) {
                sectionField.style.display = 'none';
                groupField.style.display = 'flex';
                document.getElementById('sectionSelect').value = '';
            } else {
                sectionField.style.display = 'flex';
                groupField.style.display = 'none';
                document.getElementById('groupSelect').value = '';
            }
        });
