<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ছুটির আবেদন</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    font-family:'Segoe UI', 'Noto Sans Bengali', Tahoma, sans-serif;
    background:linear-gradient(135deg,#0e7a38,#14A44D);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff;
    padding:20px;
  }
  .box{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:14px;
    padding:36px 28px;
    max-width:420px;
    backdrop-filter:blur(4px);
  }
  .box h1{ font-size:20px; margin-bottom:10px; }
  .box p{ font-size:14.5px; opacity:0.9; margin-bottom:22px; line-height:1.6; }
  .btn{
    display:inline-block;
    background:#fff;
    color:#0e7a38;
    font-weight:700;
    font-size:15px;
    padding:12px 26px;
    border-radius:8px;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,0.3); }
</style>
</head>
<body>

  <div class="box">
    <h1>ছুটির আবেদন ফর্ম</h1>
    <p>ফর্মটি একটি নতুন ট্যাবে খোলা হচ্ছে। যদি স্বয়ংক্রিয়ভাবে না খোলে, নিচের বাটনে ক্লিক করুন।</p>
    <a class="btn" id="openLink" href="https://cl-sepia.vercel.app/" target="_blank" rel="noopener noreferrer">ফর্ম খুলুন</a>
  </div>

  <script>
    // পেজ লোড হওয়ার সাথে সাথে স্বয়ংক্রিয়ভাবে নতুন ট্যাবে খোলার চেষ্টা করবে
    window.open("https://cl-sepia.vercel.app/", "_blank", "noopener,noreferrer");
  </script>

</body>
</html>
